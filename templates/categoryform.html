{% extends "common.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container">

    <h3 class="text-center my-3">Add Category</h3>

    <form method="POST">
        {% csrf_token %}

        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">
            Add Category
        </button>

    </form>

</div>

{% endblock content %}

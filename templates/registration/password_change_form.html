{% extends "common.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="col-9 col-md-5 m-auto shadow-sm my-4 p-4 rounded">

    <h3 class="text-center mb-4">Change Password</h3>

    <form method="POST">
        {% csrf_token %}

        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">
            Change Password
        </button>

        <a href="{% url 'profile' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock content %}

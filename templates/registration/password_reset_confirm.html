{% extends "common.html" %}
    {% load static %}
    {% block content %}
    {% load crispy_forms_tags %}

    <div class="col-9 col-md-4 m-auto shadow-sm my-4 p-3 rounded">
        <form method="post" enctype="multipart/form-data">
            <h3 class="lead text-center">Password Reset</h3>
            <p>Please enter your new password twice so we can verify
                you typed it correctly.</p>
            {% csrf_token %}
            {{form|crispy}}
            <button class="btn btn-primary">Reset</button>
        
        </form>
    </div>
    {% endblock content %}
